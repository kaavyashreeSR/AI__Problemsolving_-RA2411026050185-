<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tic-Tac-Toe AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Tic-Tac-Toe AI</h1>
            <p>Play against an unbeatable Minimax algorithm</p>
        </header>

        <div class="game-info">
            <div class="status" id="statusText">Your Turn (X)</div>
            <div class="difficulty-selector">
                <label for="difficulty">AI Level: </label>
                <select id="difficulty">
                    <option value="hard">Unbeatable (Minimax)</option>
                    <option value="easy">Easy (Random)</option>
                </select>
            </div>
        </div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="controls">
            <button id="resetBtn" class="btn">Restart Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
